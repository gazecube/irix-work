name: FTR MATCH smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'irix-re/libimdIconPanel/FtrMatchEvaluator.c++'
      - 'irix-re/libimdIconPanel/FtrMatchEvaluator.h'
      - 'irix-re/libimdIconPanel/FtrResolver.c++'
      - 'irix-re/libimdIconPanel/CMakeLists.txt'
      - '.github/workflows/ftr-match-smoke.yml'

jobs:
  ftr-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re

      - name: Compile evaluator
        run: |
          g++ -std=c++11 -Wall -Wextra -pedantic \
            -Iirix-re/libimdIconPanel \
            -c irix-re/libimdIconPanel/FtrMatchEvaluator.c++ \
            -o /tmp/FtrMatchEvaluator.o

      - name: Exercise MATCH language and edge semantics
        run: |
          set -eu
          rm -rf /tmp/ftr /tmp/ftr-samples
          mkdir -p /tmp/ftr/{local,install,system,default}
          mkdir -p /tmp/ftr/local/nested
          mkdir -p /tmp/ftr-samples/specialdir
          mkdir -p /tmp/ftr-samples/contains

          cat > /tmp/ftr/local/00-smoke.ftr <<'EOF'
          TYPE HashLiteral
              MATCH string(0,4) == "A#B!";
          TYPE Magic
              MATCH string(0,4) == "ABCD" && ushort(4) == 0x1234;
          TYPE Ascii512
              MATCH glob("ascii512") && ascii;
          TYPE BraceGlob
              MATCH glob("*.{c,h}") && ascii;
          TYPE Untagged
              MATCH glob("untagged") && tag == -1;
          TYPE LinkCount
              MATCH glob("links") && linkcount >= 1;
          TYPE ParentTrap
              MATCH glob("parenttrap") && dircontains("marker");
          TYPE DirContains
              MATCH dircontains("{marker,other}");
              SPECIALFILE
          TYPE ShortCircuit
              MATCH glob("plain") && (true || (1 / 0));
          TYPE SpecialDir
              MATCH true;
              SPECIALFILE
          TYPE NestedFallback
              MATCH glob("nested");
          EOF

          cat > /tmp/ftr/local/nested/00-must-not-load.ftr <<'EOF'
          TYPE WrongNested
              MATCH glob("nested");
          EOF

          printf 'A#B!' > /tmp/ftr-samples/hash
          printf '\x41\x42\x43\x44\x12\x34' > /tmp/ftr-samples/magic
          echo 'int main(void) { return 0; }' > /tmp/ftr-samples/test.c
          echo '#define X 1' > /tmp/ftr-samples/test.h
          echo 'plain' > /tmp/ftr-samples/plain
          echo 'plain' > /tmp/ftr-samples/untagged
          printf 'x' > /tmp/ftr-samples/links
          printf 'x' > /tmp/ftr-samples/parenttrap
          printf 'x' > /tmp/ftr-samples/nested
          printf 'x' > /tmp/ftr-samples/marker
          printf 'x' > /tmp/ftr-samples/contains/marker
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/ftr-samples/ascii512').write_bytes(b'A' * 512 + bytes([255]))
          PY

          cat > /tmp/ftr-smoke.cpp <<'EOF'
          #include "FtrMatchEvaluator.h"
          #include <iostream>
          #include <string>

          static int check(const char *path, bool knownDirectory, const char *expected)
          {
              std::string type;
              if (!ImdEvaluateFtrType("/tmp/ftr", path, knownDirectory, type)) {
                  std::cerr << "no type for " << path << std::endl;
                  return 1;
              }
              if (type != expected) {
                  std::cerr << path << ": got " << type << ", expected " << expected << std::endl;
                  return 1;
              }
              return 0;
          }

          int main()
          {
              int rc = 0;
              rc |= check("/tmp/ftr-samples/hash", false, "HashLiteral");
              rc |= check("/tmp/ftr-samples/magic", false, "Magic");
              rc |= check("/tmp/ftr-samples/ascii512", false, "Ascii512");
              rc |= check("/tmp/ftr-samples/test.c", false, "BraceGlob");
              rc |= check("/tmp/ftr-samples/test.h", false, "BraceGlob");
              rc |= check("/tmp/ftr-samples/untagged", false, "Untagged");
              rc |= check("/tmp/ftr-samples/links", false, "LinkCount");
              rc |= check("/tmp/ftr-samples/plain", false, "ShortCircuit");
              rc |= check("/tmp/ftr-samples/specialdir", true, "SpecialDir");
              rc |= check("/tmp/ftr-samples/contains", true, "DirContains");
              rc |= check("/tmp/ftr-samples/nested", false, "NestedFallback");

              std::string type;
              if (ImdEvaluateFtrType("/tmp/ftr", "/tmp/ftr-samples/parenttrap", false, type)) {
                  std::cerr << "regular file incorrectly satisfied dircontains: " << type << std::endl;
                  rc = 1;
              }
              return rc;
          }
          EOF

          g++ -std=c++11 -Wall -Wextra -pedantic \
            -Iirix-re/libimdIconPanel \
            /tmp/ftr-smoke.cpp irix-re/libimdIconPanel/FtrMatchEvaluator.c++ \
            -o /tmp/ftr-smoke
          /tmp/ftr-smoke
