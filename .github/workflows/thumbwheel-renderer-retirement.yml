name: ThumbWheel renderer retirement

on:
  push:
    paths:
      - '.github/workflows/thumbwheel-renderer-retirement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
      - name: Retire temporary renderer
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit
        run: |
          git config user.name "db2k"
          git config user.email "33785843+gazecube@users.noreply.github.com"
          git add irix-re/libSgm/ThumbWheel.c irix-re/docs/graveyard.md
          git diff --cached --check
          git commit -m "libSgm: bury temporary ThumbWheel renderer"
          git push origin HEAD:irix-re
