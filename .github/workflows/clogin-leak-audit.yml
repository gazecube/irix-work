name: Clogin leaked-source transfer audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clogin-leak-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
          fetch-depth: 1

      - name: Fetch IRIX 6.5.7m comparison source
        run: |
          set -eu
          git clone --depth=1 https://github.com/calmsacibis995/irix-657m-src.git /tmp/irix-657m-src

      - name: Audit complete proposed Clogin export
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          from collections import defaultdict, Counter

          repo = Path(os.environ['GITHUB_WORKSPACE'])
          leak = Path('/tmp/irix-657m-src')
          outdir = Path('/tmp/clogin-leak-audit')
          outdir.mkdir(parents=True, exist_ok=True)

          # Legacy dvlogin/Clogin application lives at repository root. The
          # evidence-oriented reconstruction lives at irix-re/clogin. The
          # verification copy is byte-identical today and is intentionally
          # omitted so the split contains one authoritative copy.
          excluded_root_dirs = {'.git', '.github', 'desktop-prototype', 'irix-re', 'irix-re-verification'}
          excluded_root_files = {'.gitattributes', '.gitmodules'}

          candidates = []
          for p in repo.iterdir():
              if p.name in excluded_root_dirs or p.name in excluded_root_files:
                  continue
              if p.is_file():
                  candidates.append(p)
              elif p.is_dir() and p.name in {'services', 'screenshots'}:
                  candidates.extend(x for x in p.rglob('*') if x.is_file())

          reconstruction = repo / 'irix-re' / 'clogin'
          candidates.extend(x for x in reconstruction.rglob('*') if x.is_file())
          candidates = sorted(set(candidates))

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def text_lines(path):
              try:
                  data = path.read_bytes()
              except OSError:
                  return None
              if not data or b'\0' in data[:8192] or len(data) > 2 * 1024 * 1024:
                  return None
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  try:
                      text = data.decode('latin-1')
                  except UnicodeDecodeError:
                      return None
              lines = []
              for line in text.splitlines():
                  line = re.sub(r'\s+', ' ', line.strip())
                  if line:
                      lines.append(line)
              return lines

          leak_files = [p for p in leak.rglob('*') if p.is_file() and '/.git/' not in str(p)]
          leak_hashes = defaultdict(list)
          for p in leak_files:
              try:
                  if p.stat().st_size == 0:
                      continue
                  leak_hashes[sha256(p)].append(p.relative_to(leak).as_posix())
              except OSError:
                  pass

          # Ten consecutive normalized nonblank lines is deliberately strict
          # enough to avoid ordinary include/boilerplate noise while catching
          # meaningful copied source blocks. No matching text is emitted.
          WINDOW = 10
          shingle_index = defaultdict(list)
          for p in leak_files:
              lines = text_lines(p)
              if not lines or len(lines) < WINDOW:
                  continue
              rel = p.relative_to(leak).as_posix()
              for i in range(len(lines) - WINDOW + 1):
                  key = hashlib.sha256('\n'.join(lines[i:i+WINDOW]).encode()).digest()
                  if len(shingle_index[key]) < 8:
                      shingle_index[key].append((rel, i + 1))

          exact = []
          overlap_rows = []
          manifest = []

          for p in candidates:
              rel = p.relative_to(repo).as_posix()
              size = p.stat().st_size
              digest = sha256(p)
              manifest.append((rel, digest, size))
              if size > 0 and digest in leak_hashes:
                  exact.append((rel, leak_hashes[digest]))

              lines = text_lines(p)
              if not lines or len(lines) < WINDOW:
                  continue

              hits = Counter()
              first = {}
              for i in range(len(lines) - WINDOW + 1):
                  key = hashlib.sha256('\n'.join(lines[i:i+WINDOW]).encode()).digest()
                  for src, src_line in shingle_index.get(key, ()):
                      hits[src] += 1
                      first.setdefault(src, (i + 1, src_line))

              if hits:
                  src, count = hits.most_common(1)[0]
                  c_line, s_line = first[src]
                  overlap_rows.append((rel, src, count, c_line, s_line))

          report = []
          report.append('Clogin leaked-source transfer audit')
          report.append('===================================')
          report.append('')
          report.append('Comparison source: calmsacibis995/irix-657m-src (depth-1 main checkout)')
          report.append('Candidate boundary: legacy root login manager + services/ + screenshots/ + irix-re/clogin/.')
          report.append('irix-re-verification/clogin is omitted because it currently has the same Git tree as irix-re/clogin.')
          report.append('Excluded from export: .github/, .gitmodules, .gitattributes, desktop-prototype/, all non-Clogin irix-re content, irix-re-verification/.')
          report.append('Zero-byte files are ignored for exact-hash matching.')
          report.append(f'Fingerprint rule: {WINDOW} consecutive whitespace-normalized nonblank lines.')
          report.append('No leaked source text is reproduced in this report.')
          report.append('')
          report.append(f'Candidate files: {len(candidates)}')
          report.append(f'Exact nonempty whole-file matches: {len(exact)}')
          report.append(f'Files with >=1 matching {WINDOW}-line window: {len(overlap_rows)}')
          report.append('')

          report.append('EXACT WHOLE-FILE MATCHES')
          report.append('------------------------')
          if exact:
              for rel, srcs in exact:
                  report.append(f'{rel}: {", ".join(srcs)}')
          else:
              report.append('none')
          report.append('')

          report.append('MULTI-LINE OVERLAP FLAGS')
          report.append('------------------------')
          if overlap_rows:
              for rel, src, count, c_line, s_line in sorted(overlap_rows):
                  report.append(f'{rel}: source={src}; matching_windows={count}; first_candidate_line={c_line}; first_source_line={s_line}')
          else:
              report.append('none')
          report.append('')

          report.append('EXPORT MANIFEST')
          report.append('---------------')
          for rel, digest, size in manifest:
              report.append(f'{digest}  {size:8d}  {rel}')

          (outdir / 'clogin-leak-audit.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report[:40]))

          # This is a transfer gate, not merely an informational scan: either
          # an exact nonempty match or a copied 10-line window blocks export.
          if exact or overlap_rows:
              raise SystemExit('audit gate failed: leaked-source overlap detected')
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clogin-leak-audit
          path: /tmp/clogin-leak-audit/
          if-no-files-found: error
