name: Clogin leaked-source transfer audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clogin-leak-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
          fetch-depth: 1

      - name: Fetch IRIX 6.5.7m comparison source
        run: |
          set -eu
          git clone --depth=1 https://github.com/calmsacibis995/irix-657m-src.git /tmp/irix-657m-src

      - name: Audit proposed Clogin export
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          from collections import defaultdict, Counter

          repo = Path(os.environ['GITHUB_WORKSPACE'])
          leak = Path('/tmp/irix-657m-src')
          outdir = Path('/tmp/clogin-leak-audit')
          outdir.mkdir(parents=True, exist_ok=True)

          excluded_root_dirs = {'.git', '.github', 'desktop-prototype', 'irix-re', 'irix-re-verification'}
          excluded_root_files = {'.gitattributes', '.gitmodules'}

          candidates = []
          for p in repo.iterdir():
              if p.name in excluded_root_dirs or p.name in excluded_root_files:
                  continue
              if p.is_file():
                  candidates.append(p)
              elif p.is_dir() and p.name in {'services', 'screenshots'}:
                  candidates.extend(x for x in p.rglob('*') if x.is_file())
          candidates = sorted(candidates)

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def text_lines(path):
              try:
                  data = path.read_bytes()
              except OSError:
                  return None
              if b'\0' in data[:8192] or len(data) > 2 * 1024 * 1024:
                  return None
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  try:
                      text = data.decode('latin-1')
                  except UnicodeDecodeError:
                      return None
              # Whitespace-normalized, content-preserving comparison. Do not emit source text.
              lines = []
              for line in text.splitlines():
                  line = re.sub(r'\s+', ' ', line.strip())
                  if line:
                      lines.append(line)
              return lines

          leak_files = [p for p in leak.rglob('*') if p.is_file() and '/.git/' not in str(p)]
          leak_hashes = defaultdict(list)
          for p in leak_files:
              try:
                  leak_hashes[sha256(p)].append(p.relative_to(leak).as_posix())
              except OSError:
                  pass

          # Build 10-line fingerprints from source. Ten consecutive normalized lines is
          # intentionally conservative: generic include blocks should not dominate the audit.
          WINDOW = 10
          shingle_index = defaultdict(list)
          for p in leak_files:
              lines = text_lines(p)
              if not lines or len(lines) < WINDOW:
                  continue
              rel = p.relative_to(leak).as_posix()
              for i in range(len(lines) - WINDOW + 1):
                  key = hashlib.sha256('\n'.join(lines[i:i+WINDOW]).encode()).digest()
                  # Cap repeated boilerplate to keep memory bounded and reduce noise.
                  if len(shingle_index[key]) < 8:
                      shingle_index[key].append((rel, i + 1))

          exact = []
          overlap_rows = []
          clean = []
          manifest = []

          for p in candidates:
              rel = p.relative_to(repo).as_posix()
              digest = sha256(p)
              manifest.append((rel, digest, p.stat().st_size))
              if digest in leak_hashes:
                  exact.append((rel, leak_hashes[digest]))

              lines = text_lines(p)
              if not lines or len(lines) < WINDOW:
                  if digest not in leak_hashes:
                      clean.append(rel)
                  continue

              hits = Counter()
              first = {}
              for i in range(len(lines) - WINDOW + 1):
                  key = hashlib.sha256('\n'.join(lines[i:i+WINDOW]).encode()).digest()
                  for src, src_line in shingle_index.get(key, ()): 
                      hits[src] += 1
                      first.setdefault(src, (i + 1, src_line))

              if hits:
                  src, count = hits.most_common(1)[0]
                  c_line, s_line = first[src]
                  overlap_rows.append((rel, src, count, c_line, s_line))
              elif digest not in leak_hashes:
                  clean.append(rel)

          report = []
          report.append('Clogin leaked-source transfer audit')
          report.append('===================================')
          report.append('')
          report.append('Comparison source: calmsacibis995/irix-657m-src (depth-1 main checkout)')
          report.append('Candidate boundary: legacy repository-root login manager + services/ + screenshots/.')
          report.append('Excluded from export: .github/, .gitmodules, .gitattributes, desktop-prototype/, irix-re/, irix-re-verification/.')
          report.append(f'Fingerprint rule: {WINDOW} consecutive whitespace-normalized nonblank lines.')
          report.append('No leaked source text is reproduced in this report.')
          report.append('')
          report.append(f'Candidate files: {len(candidates)}')
          report.append(f'Exact whole-file matches: {len(exact)}')
          report.append(f'Files with >=1 matching {WINDOW}-line window: {len(overlap_rows)}')
          report.append('')

          report.append('EXACT WHOLE-FILE MATCHES')
          report.append('------------------------')
          if exact:
              for rel, srcs in exact:
                  report.append(f'{rel}: {", ".join(srcs)}')
          else:
              report.append('none')
          report.append('')

          report.append('MULTI-LINE OVERLAP FLAGS')
          report.append('------------------------')
          if overlap_rows:
              for rel, src, count, c_line, s_line in sorted(overlap_rows):
                  report.append(f'{rel}: source={src}; matching_windows={count}; first_candidate_line={c_line}; first_source_line={s_line}')
          else:
              report.append('none')
          report.append('')

          report.append('EXPORT MANIFEST')
          report.append('---------------')
          for rel, digest, size in manifest:
              report.append(f'{digest}  {size:8d}  {rel}')

          (outdir / 'clogin-leak-audit.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report[:40]))

          # A flagged overlap is review-required, not an automatic failure. Exact copied files
          # do fail the gate because they must never be transferred into the split repository.
          if exact:
              raise SystemExit('audit gate failed: exact leaked-source file match detected')
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clogin-leak-audit
          path: /tmp/clogin-leak-audit/
          if-no-files-found: error
