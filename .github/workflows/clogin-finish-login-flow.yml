name: Clogin finish login flow

on:
  push:
    branches: [irix-re]
    paths:
      - '.github/scripts/finish_clogin_login_flow.py'
      - '.github/workflows/clogin-finish-login-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export Clogin branch
        run: git worktree add export origin/clogin-export

      - name: Apply final login-flow integration
        run: python3 .github/scripts/finish_clogin_login_flow.py

      - name: Verify recovered architecture
        run: |
          grep -q 'void PandoraComponent::doLogin()' export/reconstruction/PandoraViewKit.c++
          grep -q 'self->doLogin();' export/reconstruction/PandoraViewKit.c++
          grep -q 'PandoraLoginHandoff' export/reconstruction/PandoraViewKit.h
          grep -q 'handoffLogin(view->name().c_str(), "", true)' export/reconstruction/PandoraViewKit.c++
          grep -q 'Login/LoginTheUserModel.h' export/reconstruction/PandoraViewKit.c++

      - name: Compile recovered login model
        run: |
          g++ -std=c++11 -Iexport/reconstruction -c \
            export/reconstruction/Login/LoginTheUserModel.c++ \
            -o /tmp/LoginTheUserModel.o

      - name: Compile standalone Imd subset
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libmotif-dev libxt-dev libx11-dev
          cd export/reconstruction/imd
          g++ -std=c++11 -fPIC -I. -c ImdString.c++ ImdIconPanel.c++ ViewPanelAdopt.c++ InvertedTeeRenderer.c++

      - name: Commit refinement
        run: |
          cd export
          git config user.name db2k
          git config user.email '33785843+gazecube@users.noreply.github.com'
          git add reconstruction/PandoraViewKit.c++ reconstruction/PandoraViewKit.h
          git commit -m 'clogin: finish binary-backed login flow'
          git push origin HEAD:clogin-export
