name: SgThumbWheel deep archaeology

on:
  push:
    paths:
      - '.github/workflows/sg-thumbwheel-deep-archaeology.yml'

jobs:
  archaeology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
          lfs: true

      - name: Install analysis tools
        run: |
          python3 -m pip install --user pyelftools capstone

      - name: Recover ThumbWheel implementation
        run: |
          set -eux
          mkdir -p /tmp/shared /tmp/report
          tar -xf irix-re/evidence/shared_objects.tar -C /tmp/shared
          LIB=$(find /tmp/shared -type f -name 'libSgm.so.1' | head -n1)
          cp "$LIB" /tmp/libSgm.so.1

          python3 - <<'PY' > /tmp/report/thumbwheel-deep.txt
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_MIPS, CS_MODE_MIPS32, CS_MODE_BIG_ENDIAN
          from pathlib import Path
          import struct

          path='/tmp/libSgm.so.1'
          with open(path,'rb') as f:
              elf=ELFFile(f)
              symtab=elf.get_section_by_name('.dynsym')
              syms={s.name:s for s in symtab.iter_symbols()}
              targets=['SgCreateThumbWheel','SgThumbWheelGetValue','SgThumbWheelSetValue','sgThumbWheelClassRec','sgThumbWheelWidgetClass']
              print('ELF', elf['e_machine'], elf.elfclass, 'big_endian=', not elf.little_endian)
              for n in targets:
                  s=syms.get(n)
                  if s:
                      print(f'SYM {n} value=0x{s["st_value"]:08x} size={s["st_size"]} shndx={s["st_shndx"]}')

              def va_to_off(va):
                  for seg in elf.iter_segments():
                      if seg['p_type']!='PT_LOAD': continue
                      lo=seg['p_vaddr']; hi=lo+seg['p_filesz']
                      if lo <= va < hi:
                          return seg['p_offset'] + (va-lo)
                  raise ValueError(hex(va))

              md=Cs(CS_ARCH_MIPS, CS_MODE_MIPS32|CS_MODE_BIG_ENDIAN)
              md.detail=False
              for n in ['SgCreateThumbWheel','SgThumbWheelGetValue','SgThumbWheelSetValue']:
                  s=syms[n]; va=s['st_value']; size=s['st_size']; off=va_to_off(va)
                  f.seek(off); data=f.read(size)
                  print('\n=== DISASM',n,'===')
                  for ins in md.disasm(data, va):
                      print(f'0x{ins.address:08x}: {ins.mnemonic:8s} {ins.op_str}')

              s=syms['sgThumbWheelClassRec']; va=s['st_value']; size=s['st_size']; off=va_to_off(va)
              f.seek(off); data=f.read(size)
              print('\n=== CLASSREC HEX ===')
              for i in range(0,len(data),16):
                  chunk=data[i:i+16]
                  print(f'+0x{i:02x}: '+chunk.hex(' '))

              # print n32-sized words and likely in-image pointers
              print('\n=== CLASSREC WORDS ===')
              for i in range(0,len(data)-3,4):
                  v=struct.unpack('>I',data[i:i+4])[0]
                  tag=''
                  if 0x0b000000 <= v <= 0x0c000000:
                      tag=' PTR?'
                  print(f'+0x{i:02x}: 0x{v:08x}{tag}')

              print('\n=== DYNAMIC RELOCS MENTIONING THUMBWHEEL ===')
              for sec in elf.iter_sections():
                  if not hasattr(sec,'iter_relocations'): continue
                  for r in sec.iter_relocations():
                      idx=r['r_info_sym']
                      if idx==0: continue
                      sym=elf.get_section(sec['sh_link']).get_symbol(idx)
                      if 'ThumbWheel' in sym.name or 'thumbWheel' in sym.name:
                          print(sec.name, hex(r['r_offset']), r.entry, sym.name)
          PY

          readelf -aW /tmp/libSgm.so.1 | grep -i -C 3 thumb >> /tmp/report/thumbwheel-deep.txt || true
          strings -a -t x /tmp/libSgm.so.1 | grep -i -E 'ThumbWheel|homePosition|angleRange|unitsPerRotation|showHomeButton|animate|minimum|maximum|valueChanged|dragCallback' >> /tmp/report/thumbwheel-deep.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: sg-thumbwheel-deep-archaeology
          path: /tmp/report/thumbwheel-deep.txt
