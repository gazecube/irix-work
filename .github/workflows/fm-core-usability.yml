name: FM core usability pass

on:
  push:
    branches: [irix-re]
    paths:
      - '.github/workflows/fm-core-usability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
          fetch-depth: 0

      - name: Patch FM core usability
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          p = Path('irix-re/fm/FmMain.c++')
          s = p.read_text()

          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit('patch point mismatch: ' + old[:120])
              s = s.replace(old, new, 1)

          once('#include <Xm/MainW.h>\n#include <Xm/PushB.h>',
               '#include <Xm/MainW.h>\n#include <Xm/MessageB.h>\n#include <Xm/PushB.h>\n#include <Xm/SelectioB.h>')
          once('#include <sys/stat.h>\n#include <sys/types.h>',
               '#include <sys/stat.h>\n#include <sys/types.h>\n#include <fcntl.h>\n#include <time.h>')

          once('    std::vector<FmEntry> entries;\n    ImdDNA selectedDNA;',
               '    std::vector<FmEntry> entries;\n    std::vector<std::string> pendingRemove;\n    ImdDNA selectedDNA;')

          anchor = 'static void showHiddenCB(Widget widget, XtPointer client, XtPointer call)\n'
          if anchor not in s:
              raise SystemExit('showHiddenCB anchor missing')

          block = r'''
static std::vector<std::string> selectedPaths(FmState *state)
{
    std::vector<std::string> paths;
    if (!state || !state->dirPanel) return paths;
    const std::vector<ImdIconView *> &views = state->dirPanel->portableSelectedViews();
    for (std::vector<ImdIconView *>::const_iterator it = views.begin(); it != views.end(); ++it) {
        ImdModelBasedIconView *modelView = dynamic_cast<ImdModelBasedIconView *>(*it);
        if (!modelView) continue;
        const std::string path = ImdFileModel::fileNameFromDNA(modelView->getDNA()).stdString();
        if (!path.empty()) paths.push_back(path);
    }
    if (paths.empty() && state->haveSelectedDNA) {
        const std::string path = ImdFileModel::fileNameFromDNA(state->selectedDNA).stdString();
        if (!path.empty()) paths.push_back(path);
    }
    return paths;
}

static std::string pathBaseName(const std::string &path)
{
    const std::string::size_type slash = path.find_last_of('/');
    return slash == std::string::npos ? path : path.substr(slash + 1);
}

static bool copyObject(const std::string &source, const std::string &dest)
{
    struct stat st;
    if (lstat(source.c_str(), &st) != 0) return false;
    if (S_ISLNK(st.st_mode)) {
        char target[PATH_MAX + 1];
        const ssize_t n = readlink(source.c_str(), target, PATH_MAX);
        if (n < 0) return false;
        target[n] = '\0';
        return symlink(target, dest.c_str()) == 0;
    }
    if (S_ISDIR(st.st_mode)) {
        if (mkdir(dest.c_str(), st.st_mode & 07777) != 0) return false;
        DIR *dir = opendir(source.c_str());
        if (!dir) return false;
        bool ok = true;
        struct dirent *de;
        while ((de = readdir(dir)) != NULL) {
            if (!strcmp(de->d_name, ".") || !strcmp(de->d_name, "..")) continue;
            if (!copyObject(joinPath(source, de->d_name), joinPath(dest, de->d_name))) {
                ok = false;
                break;
            }
        }
        closedir(dir);
        return ok;
    }
    if (S_ISREG(st.st_mode)) {
        int in = open(source.c_str(), O_RDONLY);
        if (in < 0) return false;
        int out = open(dest.c_str(), O_WRONLY | O_CREAT | O_EXCL, st.st_mode & 07777);
        if (out < 0) { close(in); return false; }
        char buffer[65536];
        bool ok = true;
        for (;;) {
            ssize_t nr = read(in, buffer, sizeof(buffer));
            if (nr == 0) break;
            if (nr < 0) { ok = false; break; }
            ssize_t off = 0;
            while (off < nr) {
                ssize_t nw = write(out, buffer + off, (size_t)(nr - off));
                if (nw <= 0) { ok = false; break; }
                off += nw;
            }
            if (!ok) break;
        }
        close(out);
        close(in);
        if (!ok) unlink(dest.c_str());
        return ok;
    }
    errno = ENOTSUP;
    return false;
}

static bool removeObject(const std::string &path)
{
    struct stat st;
    if (lstat(path.c_str(), &st) != 0) return false;
    if (!S_ISDIR(st.st_mode) || S_ISLNK(st.st_mode)) return unlink(path.c_str()) == 0;
    DIR *dir = opendir(path.c_str());
    if (!dir) return false;
    bool ok = true;
    struct dirent *de;
    while ((de = readdir(dir)) != NULL) {
        if (!strcmp(de->d_name, ".") || !strcmp(de->d_name, "..")) continue;
        if (!removeObject(joinPath(path, de->d_name))) { ok = false; break; }
    }
    closedir(dir);
    if (!ok) return false;
    return rmdir(path.c_str()) == 0;
}

static std::string uniqueCopyPath(const std::string &source)
{
    const std::string::size_type slash = source.find_last_of('/');
    const std::string dir = slash == 0 ? "/" : (slash == std::string::npos ? "." : source.substr(0, slash));
    const std::string name = pathBaseName(source);
    struct stat st;
    std::string candidate = joinPath(dir, name + ".copy");
    if (lstat(candidate.c_str(), &st) != 0 && errno == ENOENT) return candidate;
    for (unsigned int n = 2; n < 10000; ++n) {
        char suffix[32];
        snprintf(suffix, sizeof(suffix), ".copy%u", n);
        candidate = joinPath(dir, name + suffix);
        if (lstat(candidate.c_str(), &st) != 0 && errno == ENOENT) return candidate;
    }
    errno = EEXIST;
    return std::string();
}

static void dismissDialogCB(Widget widget, XtPointer, XtPointer)
{
    XtUnmanageChild(widget);
}

static void newDirectoryOkCB(Widget widget, XtPointer client, XtPointer call)
{
    FmState *state = (FmState *)client;
    XmSelectionBoxCallbackStruct *cbs = (XmSelectionBoxCallbackStruct *)call;
    char *name = 0;
    if (!cbs || !XmStringGetLtoR(cbs->value, XmFONTLIST_DEFAULT_TAG, &name) || !name) return;
    if (!*name || strchr(name, '/')) {
        setStatus(state, "Directory name must be a single non-empty name");
        XtFree(name);
        return;
    }
    const std::string path = joinPath(state->directory, name);
    if (mkdir(path.c_str(), 0777) != 0) setStatusErrno(state, "Cannot create directory");
    else {
        populateDirectory(state, state->directory);
        setStatus(state, "Directory created");
        XtUnmanageChild(widget);
    }
    XtFree(name);
}

static void newDirectoryCB(Widget, XtPointer client, XtPointer)
{
    FmState *state = (FmState *)client;
    Widget dialog = XmCreatePromptDialog(state->shell, (char *)"newDirectoryDialog", NULL, 0);
    XmString prompt = XmStringCreateLocalized((char *)"Directory name:");
    XtVaSetValues(dialog, XmNselectionLabelString, prompt, NULL);
    XmStringFree(prompt);
    XtUnmanageChild(XmSelectionBoxGetChild(dialog, XmDIALOG_HELP_BUTTON));
    XtAddCallback(dialog, XmNokCallback, newDirectoryOkCB, state);
    XtAddCallback(dialog, XmNcancelCallback, dismissDialogCB, NULL);
    XtManageChild(dialog);
}

static void copySelectedCB(Widget, XtPointer client, XtPointer)
{
    FmState *state = (FmState *)client;
    const std::vector<std::string> paths = selectedPaths(state);
    if (paths.empty()) { setStatus(state, "No item selected"); return; }
    unsigned long copied = 0;
    for (std::vector<std::string>::const_iterator it = paths.begin(); it != paths.end(); ++it) {
        const std::string dest = uniqueCopyPath(*it);
        if (dest.empty() || !copyObject(*it, dest)) {
            setStatusErrno(state, "Cannot make copy");
            break;
        }
        ++copied;
    }
    populateDirectory(state, state->directory);
    char text[96];
    snprintf(text, sizeof(text), "%lu item%s copied", copied, copied == 1 ? "" : "s");
    setStatus(state, text);
}

static void removeConfirmCB(Widget widget, XtPointer client, XtPointer)
{
    FmState *state = (FmState *)client;
    unsigned long removed = 0;
    for (std::vector<std::string>::const_iterator it = state->pendingRemove.begin(); it != state->pendingRemove.end(); ++it) {
        if (!removeObject(*it)) { setStatusErrno(state, "Cannot remove item"); break; }
        ++removed;
    }
    state->pendingRemove.clear();
    XtUnmanageChild(widget);
    populateDirectory(state, state->directory);
    char text[96];
    snprintf(text, sizeof(text), "%lu item%s removed", removed, removed == 1 ? "" : "s");
    setStatus(state, text);
}

static void removeCancelCB(Widget widget, XtPointer client, XtPointer)
{
    FmState *state = (FmState *)client;
    state->pendingRemove.clear();
    XtUnmanageChild(widget);
}

static void removeSelectedCB(Widget, XtPointer client, XtPointer)
{
    FmState *state = (FmState *)client;
    state->pendingRemove = selectedPaths(state);
    if (state->pendingRemove.empty()) { setStatus(state, "No item selected"); return; }
    Widget dialog = XmCreateQuestionDialog(state->shell, (char *)"removeDialog", NULL, 0);
    char question[160];
    snprintf(question, sizeof(question), "Remove %lu selected item%s?",
             (unsigned long)state->pendingRemove.size(), state->pendingRemove.size() == 1 ? "" : "s");
    XmString message = XmStringCreateLocalized(question);
    XtVaSetValues(dialog, XmNmessageString, message, NULL);
    XmStringFree(message);
    XtUnmanageChild(XmMessageBoxGetChild(dialog, XmDIALOG_HELP_BUTTON));
    XtAddCallback(dialog, XmNokCallback, removeConfirmCB, state);
    XtAddCallback(dialog, XmNcancelCallback, removeCancelCB, state);
    XtManageChild(dialog);
}

static void getInfoCB(Widget, XtPointer client, XtPointer)
{
    FmState *state = (FmState *)client;
    const std::vector<std::string> paths = selectedPaths(state);
    if (paths.empty()) { setStatus(state, "No item selected"); return; }
    struct stat st;
    if (lstat(paths.front().c_str(), &st) != 0) { setStatusErrno(state, "Cannot get info"); return; }
    char when[64] = "unknown";
    struct tm tmv;
    if (localtime_r(&st.st_mtime, &tmv)) strftime(when, sizeof(when), "%Y-%m-%d %H:%M:%S", &tmv);
    char text[1024];
    snprintf(text, sizeof(text),
             "Name: %s\nPath: %s\nType: %s\nSize: %lld bytes\nMode: %04o\nModified: %s",
             pathBaseName(paths.front()).c_str(), paths.front().c_str(),
             S_ISDIR(st.st_mode) ? "Directory" : (S_ISLNK(st.st_mode) ? "Symbolic Link" : (S_ISREG(st.st_mode) ? "File" : "Special")),
             (long long)st.st_size, (unsigned)(st.st_mode & 07777), when);
    Widget dialog = XmCreateInformationDialog(state->shell, (char *)"infoDialog", NULL, 0);
    XmString message = XmStringCreateLocalized(text);
    XtVaSetValues(dialog, XmNmessageString, message, NULL);
    XmStringFree(message);
    XtUnmanageChild(XmMessageBoxGetChild(dialog, XmDIALOG_CANCEL_BUTTON));
    XtUnmanageChild(XmMessageBoxGetChild(dialog, XmDIALOG_HELP_BUTTON));
    XtAddCallback(dialog, XmNokCallback, dismissDialogCB, NULL);
    XtManageChild(dialog);
}

'''
          s = s.replace(anchor, block + anchor, 1)

          once('    makePush(menu, "newDirMenuItem", unimplementedCB, state);',
               '    makePush(menu, "newDirMenuItem", newDirectoryCB, state);')
          once('    makePush(menu, "copyMenuItem", unimplementedCB, state);',
               '    makePush(menu, "copyMenuItem", copySelectedCB, state);')
          once('    makePush(menu, "removeMenuItem", unimplementedCB, state);',
               '    makePush(menu, "removeMenuItem", removeSelectedCB, state);')
          once('    makePush(menu, "getInfoMenuItem", unimplementedCB, state);',
               '    makePush(menu, "getInfoMenuItem", getInfoCB, state);')

          old = '''    makePush(rc2, "pathfinder", unimplementedCB, state);\n    makePush(rc2, "iconicLayout", layoutButtonCB, state);\n    makePush(rc2, "listLayout", layoutButtonCB, state);\n    makePush(rc2, "treeLayout", layoutButtonCB, state);\n    makePush(rc2, "columnLayout", layoutButtonCB, state);\n    makePush(rc2, "galleryMode", layoutButtonCB, state);\n    makePush(rc2, "shelf", unimplementedCB, state);'''
          new = '''    struct SidebarButton { const char *name; const char *bitmap; XtCallbackProc callback; };\n    static const SidebarButton sidebar[] = {\n        { "pathfinder", "/usr/include/X11/bitmaps/sgidesktop/pathfinder.bm", unimplementedCB },\n        { "iconicLayout", "/usr/include/X11/bitmaps/sgidesktop/iconicDirView.bm", layoutButtonCB },\n        { "listLayout", "/usr/include/X11/bitmaps/sgidesktop/listDirView.bm", layoutButtonCB },\n        { "treeLayout", "/usr/include/X11/bitmaps/sgidesktop/treeDirView.bm", layoutButtonCB },\n        { "columnLayout", "/usr/include/X11/bitmaps/sgidesktop/columnDirView.bm", layoutButtonCB },\n        { "galleryMode", "/usr/include/X11/bitmaps/sgidesktop/galleryDirView.bm", layoutButtonCB },\n        { "shelf", "/usr/include/X11/bitmaps/sgidesktop/shelf.bm", unimplementedCB }\n    };\n    Display *display = XtDisplay(parent);\n    const Drawable bitmapRoot = DefaultRootWindow(display);\n    for (unsigned int i = 0; i < sizeof(sidebar) / sizeof(sidebar[0]); ++i) {\n        Widget button = makePush(rc2, sidebar[i].name, sidebar[i].callback, state);\n        XtVaSetValues(button, XmNmarginLeft, 2, XmNmarginRight, 2, XmNmarginWidth, 2, NULL);\n        unsigned int bw = 0, bh = 0;\n        int hotx = 0, hoty = 0;\n        Pixmap bitmap = None;\n        if (XReadBitmapFile(display, bitmapRoot, sidebar[i].bitmap, &bw, &bh, &bitmap, &hotx, &hoty) == BitmapSuccess)\n            XtVaSetValues(button, XmNlabelType, XmPIXMAP, XmNlabelPixmap, bitmap, NULL);\n    }'''
          once(old, new)

          # Keep the exact original fallback resources available even when the
          # shipped app-defaults are not installed on the host.
          once('    (char *)"*rc2.packing: PACK_TIGHT",\n',
               '    (char *)"*rc2.packing: PACK_TIGHT",\n'
               '    (char *)"*rc2.XmPushButton.marginLeft: 2",\n'
               '    (char *)"*rc2.XmPushButton.marginRight: 2",\n'
               '    (char *)"*rc2.XmPushButton.marginWidth: 2",\n')

          p.write_text(s)
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libmotif-dev libx11-dev libxt-dev

      - name: Configure and build FM
        run: |
          cmake -S irix-re -B /tmp/irix-re-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/irix-re-build --target fm -j2

      - name: Commit tested FM usability pass
        run: |
          set -eu
          git config user.name db2k
          git config user.email '33785843+gazecube@users.noreply.github.com'
          git add irix-re/fm/FmMain.c++
          git diff --cached --quiet && exit 0
          git commit -m 'fm: add core file operations and restore SGI sidebar bitmaps'
          git push origin HEAD:irix-re
