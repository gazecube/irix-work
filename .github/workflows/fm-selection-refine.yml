name: Refine FM selection from binary evidence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fm-selection-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
          fetch-depth: 1

      - name: Apply binary-shaped Select All path to verification tree
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          path = Path('irix-re-verification/fm/FmMain.c++')
          text = path.read_text()
          old = '''static void selectAllCB(Widget, XtPointer client, XtPointer)\n{\n    FmState *state = (FmState *)client;\n    const std::vector<ImdView *> &views = state->dirPanel->portableViews();\n    state->dirPanel->beginSelectBlock();\n    for (std::vector<ImdView *>::const_iterator it = views.begin(); it != views.end(); ++it) {\n        ImdIconView *view = dynamic_cast<ImdIconView *>(*it);\n        if (!view || !view->portableVisible() || view->getFlag(8u)) continue;\n        state->dirPanel->extendSelect(view);\n    }\n    state->dirPanel->endSelectBlock();\n\n    char text[96];\n    snprintf(text, sizeof(text), "%lu items selected",\n             (unsigned long)state->dirPanel->portableSelectedViews().size());\n    setStatus(state, text);\n}\n'''
          new = '''/*\n * Original fm exports selectAllHelper(ImdView *, void *). The N32 body:\n *   - converts the generic ImdView to an icon view,\n *   - rejects views whose visible/state bit is clear,\n *   - rejects views already carrying icon-state flag 8, and\n *   - asks the selection holder to extend the selection.\n *\n * The portable dynamic_cast/portableVisible() calls are host ABI seams; the\n * ordering and selection test come from the original fm disassembly.\n */\nstatic void selectAllHelper(ImdView *rawView, void *client)\n{\n    ImdModelBasedIconPanel *selectionHolder = (ImdModelBasedIconPanel *)client;\n    ImdIconView *view = dynamic_cast<ImdIconView *>(rawView);\n    if (!selectionHolder || !view) return;\n    if (!view->portableVisible()) return;\n    if (view->getFlag(8u)) return;\n    selectionHolder->extendSelect(view);\n}\n\nstatic void selectAllCB(Widget, XtPointer client, XtPointer)\n{\n    FmState *state = (FmState *)client;\n    ImdModelBasedIconPanel *selectionHolder = state->dirPanel;\n    if (!selectionHolder) return;\n\n    const std::vector<ImdView *> &views = selectionHolder->portableViews();\n    selectionHolder->beginSelectBlock();\n    for (std::vector<ImdView *>::const_iterator it = views.begin(); it != views.end(); ++it)\n        selectAllHelper(*it, selectionHolder);\n    selectionHolder->endSelectBlock();\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Select All patch point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Keep canonical tree untouched
        run: |
          set -eu
          git diff --exit-code -- irix-re/
          git diff --check
          git diff -- irix-re-verification/fm/FmMain.c++

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libmotif-dev libx11-dev libxt-dev

      - name: Build verification tree
        run: |
          set -eu
          cmake -S irix-re-verification -B /tmp/irix-re-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/irix-re-build -j2

      - name: Commit verified refinement
        run: |
          set -eu
          git config user.name 'db2k'
          git config user.email '33785843+gazecube@users.noreply.github.com'
          git add irix-re-verification/fm/FmMain.c++
          git diff --cached --quiet && exit 0
          git commit -m 'fm: shape Select All around original helper path'
          git push origin HEAD:irix-re
