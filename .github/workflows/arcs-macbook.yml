name: ARCS MacBook EFI bring-up

on:
  workflow_dispatch:
  push:
    branches:
      - arcs-macbook
    paths:
      - 'arcs/**'
      - '.github/workflows/arcs-macbook.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install EDK II build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acpica-tools \
            build-essential \
            nasm \
            python3 \
            uuid-dev

      - name: Check out EDK II
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          path: edk2
          submodules: recursive

      - name: Build BaseTools
        working-directory: edk2
        run: make -C BaseTools

      - name: Build ARCS MacBook EFI image
        env:
          WORKSPACE: ${{ github.workspace }}/edk2
          TOOLCHAIN: GCC
          TARGET: DEBUG
        run: |
          chmod +x arcs/build-edk2.sh arcs/prepare-original-fonts.sh
          ./arcs/build-edk2.sh

      - name: Collect MacBook EFI image
        run: |
          mkdir -p out
          cp edk2/Build/ArcsPkg/DEBUG_GCC/X64/ArcsGfxBringup.efi out/ARCS-MacBook.efi

      - name: Upload MacBook EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARCS-MacBook-EFI
          path: out/ARCS-MacBook.efi
          if-no-files-found: error
          retention-days: 14
