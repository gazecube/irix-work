name: FM remove XmList

on:
  push:
    paths:
      - '.github/workflows/fm-kill-xmlist.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re

      - name: Remove XmList bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('irix-re/fm/FmMain.c++')
          s = p.read_text()

          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit('expected unique block not found: ' + old[:120])
              s = s.replace(old, new, 1)

          once('#include "IconLayout.h"\n', '#include "IconLayout.h"\n#include "FmIconSurface.h"\n')
          once('#include <Xm/List.h>\n', '')

          once('    Widget list;\n', '    FmIconSurface *surface;\n')
          once('    bool panelResizeActive;\n', '')

          old_pop = '''    XmListDeleteAllItems(state->list);\n    for (std::vector<FmEntry>::const_iterator it = next.begin();\n         it != next.end(); ++it) {\n        std::string visible = it->name;\n        if (it->directory)\n            visible += "/";\n        XmString item = XmStringCreateLocalized((char *)visible.c_str());\n        XmListAddItemUnselected(state->list, item, 0);\n        XmStringFree(item);\n    }\n\n'''
          new_pop = '''    std::vector<FmIconSurfaceEntry> surfaceEntries;\n    surfaceEntries.reserve(next.size());\n    for (std::vector<FmEntry>::const_iterator it = next.begin();\n         it != next.end(); ++it) {\n        FmIconSurfaceEntry surfaceEntry;\n        surfaceEntry.name = it->name;\n        surfaceEntry.directory = it->directory;\n        surfaceEntries.push_back(surfaceEntry);\n    }\n    state->surface->setEntries(surfaceEntries);\n\n'''
          once(old_pop, new_pop)

          old_sel = '''static bool\nselectedEntry(FmState *state, FmEntry *entry)\n{\n    int *positions = NULL;\n    int count = 0;\n\n    if (!XmListGetSelectedPos(state->list, &positions, &count) || count < 1)\n        return false;\n\n    const int index = positions[0] - 1;\n    XtFree((char *)positions);\n    if (index < 0 || (size_t)index >= state->entries.size())\n        return false;\n\n    *entry = state->entries[(size_t)index];\n    return true;\n}\n'''
          new_sel = '''static bool\nselectedEntry(FmState *state, FmEntry *entry)\n{\n    size_t index = 0;\n\n    if (!state->surface->selectedIndex(&index) || index >= state->entries.size())\n        return false;\n\n    *entry = state->entries[index];\n    return true;\n}\n'''
          once(old_sel, new_sel)

          old_default = '''static void\nlistDefaultActionCB(Widget widget, XtPointer client, XtPointer call)\n{\n    FmState *state = (FmState *)client;\n    XmListCallbackStruct *cbs = (XmListCallbackStruct *)call;\n    int index;\n\n    (void)widget;\n    index = cbs->item_position - 1;\n    if (index < 0 || (size_t)index >= state->entries.size())\n        return;\n    openEntry(state, state->entries[(size_t)index]);\n}\n'''
          new_default = '''static void\nsurfaceActivateCB(size_t index, void *closure)\n{\n    FmState *state = (FmState *)closure;\n\n    if (index >= state->entries.size())\n        return;\n    openEntry(state, state->entries[index]);\n}\n'''
          once(old_default, new_default)

          old_selectall = '''    for (size_t i = 0; i < state->entries.size(); ++i)\n        XmListSelectPos(state->list, (int)i + 1, False);\n'''
          once(old_selectall, '    state->surface->selectAll();\n')

          s = s.replace('     * view until ImdIconLayout/model view creation is online.\n',
                        '     * view population now runs through adopted ImdIconView objects.\n', 1)

          pat = re.compile(r'''static void\npanelResizeCB\(Widget widget, XtPointer client, XtPointer call\)\n\{.*?\n\}\n\nstatic void\nreapChildren''', re.S)
          if len(pat.findall(s)) != 1:
              raise SystemExit('panelResizeCB block not found uniquely')
          s = pat.sub('static void\nreapChildren', s, count=1)

          once('    state.list = 0;\n', '    state.surface = 0;\n')
          once('    state.panelResizeActive = false;\n', '')

          s = s.replace('     * The broker/model path is not online yet, so the temporary list remains\n     * a child of the real reconstructed IMD panel widget.\n',
                        '     * The broker/model path is not online yet. Directory entries are now\n     * adopted as ImdIconView objects directly by the reconstructed panel.\n', 1)

          old_create = '''    state.list = XtVaCreateManagedWidget("directoryList",\n                                         xmListWidgetClass,\n                                         state.panelWidget,\n                                         XmNselectionPolicy, XmEXTENDED_SELECT,\n                                         XmNvisibleItemCount, 18,\n                                         NULL);\n    XtAddCallback(state.panelWidget, XmNresizeCallback, panelResizeCB, &state);\n\n'''
          new_create = '''    /*\n     * RE: libimdIconPanel proves ImdIconPanel::adoptView(ImdIconView *, ...)\n     * and ImdViewPanelDeleteAllViews(). FmIconSurface uses that recovered\n     * ownership direction while renderer/view drawing is brought online.\n     * There is intentionally no Motif child widget inside the IMD panel.\n     */\n    state.surface = new FmIconSurface(state.dirPanel, state.panelWidget);\n    state.surface->setActivateProc(surfaceActivateCB, &state);\n\n'''
          once(old_create, new_create)

          old_cb = '''    XtAddCallback(state.list, XmNdefaultActionCallback,\n                  listDefaultActionCB, &state);\n'''
          once(old_cb, '')
          once('    panelResizeCB(state.panelWidget, &state, 0);\n', '')

          if 'XmList' in s or 'xmListWidgetClass' in s or 'state->list' in s or 'state.list' in s:
              raise SystemExit('XmList residue remains in FmMain.c++')

          p.write_text(s)
          PY

      - name: Commit XmList removal
        run: |
          git config user.name "db2k"
          git config user.email "33785843+gazecube@users.noreply.github.com"
          git add irix-re/fm/FmMain.c++
          git diff --cached --check
          git commit -m "fm: remove XmList bootstrap"
          git push origin HEAD:irix-re
