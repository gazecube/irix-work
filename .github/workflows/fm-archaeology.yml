name: FM binary archaeology

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fm-archaeology.yml'

jobs:
  original-fm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MIPS binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Extract original fm
        run: |
          mkdir -p /tmp/fm-evidence

          fm_entry="$(tar -tf irix-re/evidence/shared_objects.tar | grep '/usr/sbin/fm$' | head -1)"
          if test -z "$fm_entry"; then
            fm_entry="$(tar -tf irix-re/evidence/shared_objects.tar | grep '/fm$' | grep -E '/usr/(sbin|bin)/fm$' | head -1)"
          fi
          test -n "$fm_entry"

          echo "fm archive entry: $fm_entry"
          tar -xf irix-re/evidence/shared_objects.tar -C /tmp/fm-evidence "$fm_entry"

          fm="/tmp/fm-evidence/$fm_entry"
          file "$fm"
          sha256sum "$fm"
          echo "FM_ORIGINAL=$fm" >> "$GITHUB_ENV"

      - name: Binary identity and dependencies
        run: |
          echo '--- ELF header ---'
          mips-linux-gnu-readelf -h "$FM_ORIGINAL"
          echo '--- program headers ---'
          mips-linux-gnu-readelf -l "$FM_ORIGINAL"
          echo '--- dynamic section ---'
          mips-linux-gnu-readelf -d "$FM_ORIGINAL" | c++filt

      - name: Recover FM symbols
        run: |
          mips-linux-gnu-readelf -Ws "$FM_ORIGINAL" | c++filt > /tmp/fm-symbols.txt

          echo '--- FmApp / FmWindow / ImdBackWindow ---'
          grep -E 'FmApp|FmWindow|ImdBackWindow' /tmp/fm-symbols.txt || true

          echo '--- panel/model/view architecture ---'
          grep -E 'ImdModelBasedIconPanel|ImdViewPanel|ImdIconLayout|ImdInvertedTeeRenderer|ImdBroker|ImdDNA|ImdRefModel|FmMenuActions|FmMenuHandler|ImdViewerFinder' /tmp/fm-symbols.txt || true

      - name: Recover source-unit paths and UI strings
        run: |
          strings -a "$FM_ORIGINAL" > /tmp/fm-strings.txt

          echo '--- source paths ---'
          grep -E '/[^ ]+\.(c\+\+|cxx|cc|C|c)$' /tmp/fm-strings.txt | sort -u || true

          echo '--- startup/window strings ---'
          grep -E 'FileManager|backWindow|LayoutStyle|ShowAsGallery|ShowShelf|ShowContent|ContentHeight|usage: fm|view|gallery|shelf|content|windowWxH' /tmp/fm-strings.txt || true

          echo '--- widget/resource-like strings ---'
          grep -E 'panel|Panel|finder|Finder|menu|Menu|shelf|Shelf|status|Status|XmN|SgN|visual|Visual|layout|Layout' /tmp/fm-strings.txt | head -400 || true

      - name: Map dynamic GOT calls
        run: |
          mips-linux-gnu-readelf -A "$FM_ORIGINAL" | c++filt > /tmp/fm-got.txt
          grep -E -B1 -A1 'ImdModelBasedIconPanel|ImdViewPanel|ImdIconLayout|ImdInvertedTeeRenderer|ImdBroker|ImdDNA|ImdRefModel|FmMenuActions|FmMenuHandler|ImdViewerFinder|XmCreateForm|XtVaCreateManagedWidget|VkSimpleWindow|VkWindow' /tmp/fm-got.txt || true

      - name: Disassemble FmApp processArgs
        run: |
          # Binary-proven symbol from the preserved original fm:
          # processArgs__5FmAppGiPPc at 0x10022b18, size 3160.
          mips-linux-gnu-objdump -drC \
            --start-address=0x10022b18 \
            --stop-address=0x10023770 \
            "$FM_ORIGINAL" > /tmp/fm-processargs.txt
          cat /tmp/fm-processargs.txt

      - name: Disassemble FmWindow createPanels
        run: |
          # Binary-proven start recovered previously. Capture a broad bounded
          # neighborhood; exact function size will be taken from this run's
          # symbol table before narrowing subsequent passes.
          mips-linux-gnu-objdump -drC \
            --start-address=0x100187e0 \
            --stop-address=0x1001a800 \
            "$FM_ORIGINAL" > /tmp/fm-createpanels.txt
          cat /tmp/fm-createpanels.txt

      - name: Write focused FM archaeology report
        run: |
          report=/tmp/fm-evidence/fm-binary-report.txt
          : > "$report"

          section()
          {
            printf '\n===== %s =====\n' "$1" >> "$report"
          }

          section 'file and sha256'
          file "$FM_ORIGINAL" >> "$report"
          sha256sum "$FM_ORIGINAL" >> "$report"

          section 'dynamic dependencies'
          mips-linux-gnu-readelf -d "$FM_ORIGINAL" | c++filt >> "$report"

          section 'relevant symbols'
          grep -E 'FmApp|FmWindow|ImdBackWindow|ImdModelBasedIconPanel|ImdViewPanel|ImdIconLayout|ImdInvertedTeeRenderer|ImdBroker|ImdDNA|ImdRefModel|FmMenuActions|FmMenuHandler|ImdViewerFinder' /tmp/fm-symbols.txt >> "$report" || true

          section 'source paths'
          grep -E '/[^ ]+\.(c\+\+|cxx|cc|C|c)$' /tmp/fm-strings.txt | sort -u >> "$report" || true

          section 'startup and view strings'
          grep -E 'FileManager|backWindow|LayoutStyle|ShowAsGallery|ShowShelf|ShowContent|ContentHeight|usage: fm|windowWxH' /tmp/fm-strings.txt >> "$report" || true

          section 'GOT neighborhood'
          grep -E -B1 -A1 'ImdModelBasedIconPanel|ImdViewPanel|ImdIconLayout|ImdInvertedTeeRenderer|ImdBroker|ImdDNA|ImdRefModel|FmMenuActions|FmMenuHandler|ImdViewerFinder|XmCreateForm|XtVaCreateManagedWidget|VkSimpleWindow|VkWindow' /tmp/fm-got.txt >> "$report" || true

          section 'FmApp::processArgs'
          cat /tmp/fm-processargs.txt >> "$report"

          section 'FmWindow::_createPanels neighborhood'
          cat /tmp/fm-createpanels.txt >> "$report"

      - name: Upload focused FM archaeology report
        uses: actions/upload-artifact@v4
        with:
          name: fm-binary-archaeology
          path: /tmp/fm-evidence/fm-binary-report.txt
          if-no-files-found: error
