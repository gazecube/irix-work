name: FTR mactype binary archaeology

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ftr-mactype-archaeology.yml'

jobs:
  mactype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
          lfs: true

      - name: Install MIPS binutils and DWARF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu python3-pyelftools

      - name: Extract original N32 FTR binaries
        run: |
          set -eu
          mkdir -p /tmp/ftr-evidence
          ftrdb_entry="$(tar -tf irix-re/evidence/shared_objects.tar | grep '/usr/lib32/internal/libimdFtrDB.so$' | head -1)"
          old_entry="$(tar -tf irix-re/evidence/shared_objects.tar | grep -E '/usr/lib32/internal/libdesktopFileicon\.so(\.[0-9]+)*$' | head -1 || true)"
          test -n "$ftrdb_entry"
          tar -xf irix-re/evidence/shared_objects.tar -C /tmp/ftr-evidence "$ftrdb_entry"
          if [ -n "$old_entry" ]; then tar -xf irix-re/evidence/shared_objects.tar -C /tmp/ftr-evidence "$old_entry"; fi
          ftrdb="/tmp/ftr-evidence/$ftrdb_entry"
          echo "FTRDB=$ftrdb" >> "$GITHUB_ENV"
          echo "OLDLIB=${old_entry:+/tmp/ftr-evidence/$old_entry}" >> "$GITHUB_ENV"
          file "$ftrdb"
          sha256sum "$ftrdb"
          if [ -n "$old_entry" ]; then file "/tmp/ftr-evidence/$old_entry"; sha256sum "/tmp/ftr-evidence/$old_entry"; fi

      - name: Recover Mac symbols and source units
        run: |
          set -eu
          mips-linux-gnu-readelf -Ws "$FTRDB" > /tmp/ftrdb-symbols.raw
          mips-linux-gnu-readelf -Ws "$FTRDB" | c++filt > /tmp/ftrdb-symbols.txt
          strings -a "$FTRDB" > /tmp/ftrdb-strings.txt
          grep -Ei 'FtrMacInfo|_imdFtrMac(Type|Creator)|Mac(Type|Creator)|appleFileHandler|mactype|maccreator|AppleDouble|AppleSingle|MacBinary|HSAncillary|HSResource|EtherShare|FinderInfo|resource fork|resourcefork|AFP|afh' /tmp/ftrdb-symbols.txt /tmp/ftrdb-strings.txt || true

      - name: Resolve Apple handler APIs and GOT
        run: |
          set -eu
          {
            echo '===== dynamic symbols ====='
            mips-linux-gnu-objdump -TC "$FTRDB" | grep -Ei 'afh|apple|resource|finder|entry|open|close' || true
            echo
            echo '===== all named Apple handler functions ====='
            mips-linux-gnu-readelf -Ws "$FTRDB" | c++filt | grep -Ei 'afh|apple|resource|finder|entry|open|close' || true
            echo
            echo '===== relocations ====='
            mips-linux-gnu-readelf -r "$FTRDB" | c++filt
            echo
            echo '===== MIPS GOT / ABI data ====='
            mips-linux-gnu-readelf -A "$FTRDB" | c++filt || true
            echo
            echo '===== dynamic section ====='
            mips-linux-gnu-readelf -d "$FTRDB" | c++filt
          } > /tmp/ftrdb-got.txt
          cat /tmp/ftrdb-got.txt

      - name: Recover Mac DWARF
        run: |
          set -eu
          mips-linux-gnu-readelf --debug-dump=info "$FTRDB" | c++filt > /tmp/ftrdb-dwarf.txt || true
          grep -n -E -A100 -B25 'FtrMacInfo|appleFileHandler\.c|mactype\.c|mactype|maccreator|getMac(FileInfo|Type|Creator)|_imdFtrMac(Type|Creator)|afh(Open|Close|Get)' /tmp/ftrdb-dwarf.txt > /tmp/ftrdb-dwarf-focused.txt || true
          cat /tmp/ftrdb-dwarf-focused.txt

      - name: Enumerate Apple handler compile units structurally
        run: |
          set -eu
          cat > /tmp/dump-cu-functions.py <<'PY'
          import os
          import sys
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.descriptions import describe_form_class

          def text(attr):
              if not attr:
                  return ''
              value = attr.value
              if isinstance(value, bytes):
                  return value.decode('utf-8', 'replace')
              return str(value)

          def dump(path, needles):
              if not path or not os.path.isfile(path):
                  return
              with open(path, 'rb') as fp:
                  elf = ELFFile(fp)
                  if not elf.has_dwarf_info():
                      return
                  dwarf = elf.get_dwarf_info()
                  for cu in dwarf.iter_CUs():
                      top = cu.get_top_DIE()
                      cu_name = text(top.attributes.get('DW_AT_name'))
                      if not any(n.lower() in cu_name.lower() for n in needles):
                          continue
                      print('CU\t%s\t%s' % (path, cu_name))
                      for die in cu.iter_DIEs():
                          if die.tag != 'DW_TAG_subprogram':
                              continue
                          attrs = die.attributes
                          name = text(attrs.get('DW_AT_name'))
                          if not name:
                              name = text(attrs.get('DW_AT_linkage_name'))
                          low = attrs.get('DW_AT_low_pc')
                          high = attrs.get('DW_AT_high_pc')
                          if not name or not low or not high:
                              continue
                          start = int(low.value)
                          high_class = describe_form_class(high.form)
                          stop = int(high.value) if high_class == 'address' else start + int(high.value)
                          if stop <= start:
                              continue
                          print('FUNC\t%s\t%s\t0x%x\t0x%x\t%d' %
                                (path, name, start, stop, stop - start))

          dump(os.environ.get('FTRDB', ''), ['appleFileHandler.c', 'ftrType.c++'])
          dump(os.environ.get('OLDLIB', ''), ['mactype.c', 'appleFileHandler.c'])
          PY
          python3 /tmp/dump-cu-functions.py | tee /tmp/apple-cu-functions.tsv

          : > /tmp/apple-cu-disassembly.txt
          while IFS=$'\t' read -r kind image name start stop size; do
            [ "$kind" = FUNC ] || continue
            printf '\n===== %s :: %s %s..%s size %s =====\n' "$image" "$name" "$start" "$stop" "$size" >> /tmp/apple-cu-disassembly.txt
            mips-linux-gnu-objdump -drC --start-address="$start" --stop-address="$stop" "$image" >> /tmp/apple-cu-disassembly.txt
          done < /tmp/apple-cu-functions.tsv
          cat /tmp/apple-cu-disassembly.txt

      - name: Disassemble Mac and Apple handler entry points
        run: |
          set -eu
          out=/tmp/ftrdb-mac-disassembly.txt
          : > "$out"
          grep -E 'FtrMacInfo|_imdFtrMac(Type|Creator)|afh[A-Za-z0-9_]*|apple[A-Za-z0-9_]*' /tmp/ftrdb-symbols.raw | while read -r num value size type bind vis ndx name; do
            case "$type" in FUNC) ;; *) continue ;; esac
            start=$((16#$value)); stop=$((start + size))
            printf '\n===== %s 0x%x size %d =====\n' "$name" "$start" "$size" >> "$out"
            mips-linux-gnu-objdump -drC --start-address="$start" --stop-address="$stop" "$FTRDB" >> "$out"
          done
          cat "$out"

      - name: Inspect Mac-related literals
        run: |
          set -eu
          strings -a -t x "$FTRDB" | grep -Ei 'Apple|Mac|HSAncillary|HSResource|resource|Finder|AFP|Ether|Double|Single|\.resource|\.finder|\.AppleDouble|%[A-Za-z]' > /tmp/ftrdb-mac-strings.txt || true
          cat /tmp/ftrdb-mac-strings.txt

      - name: Inspect older N32 desktop fileicon implementation
        run: |
          set -eu
          : > /tmp/old-mactype.txt
          if [ -n "${OLDLIB:-}" ] && [ -f "$OLDLIB" ]; then
            mips-linux-gnu-readelf -Ws "$OLDLIB" > /tmp/old-symbols.raw
            echo '===== symbols =====' >> /tmp/old-mactype.txt
            mips-linux-gnu-readelf -Ws "$OLDLIB" | c++filt | grep -Ei 'mactype|maccreator|mac|apple|finder|resource|ancillary' >> /tmp/old-mactype.txt || true
            echo '===== strings =====' >> /tmp/old-mactype.txt
            strings -a -t x "$OLDLIB" | grep -Ei 'mactype\.c|mactype|maccreator|HSAncillary|HSResource|Apple|Finder|Ether|Double|Single|resource' >> /tmp/old-mactype.txt || true
            echo '===== disassembly =====' >> /tmp/old-mactype.txt
            grep -E 'MacType|MacCreator' /tmp/old-symbols.raw | while read -r num value size type bind vis ndx name; do
              case "$type" in FUNC) ;; *) continue ;; esac
              start=$((16#$value)); stop=$((start + size))
              printf '\n===== %s 0x%x size %d =====\n' "$name" "$start" "$size" >> /tmp/old-mactype.txt
              mips-linux-gnu-objdump -drC --start-address="$start" --stop-address="$stop" "$OLDLIB" >> /tmp/old-mactype.txt
            done
          fi
          cat /tmp/old-mactype.txt

      - name: Assemble archaeology report
        run: |
          set -eu
          mkdir -p /tmp/ftr-mactype-report
          report=/tmp/ftr-mactype-report/ftr-mactype-report.txt
          {
            echo '===== specimen ====='; file "$FTRDB"; sha256sum "$FTRDB"
            echo; echo '===== symbols ====='; grep -Ei 'FtrMacInfo|_imdFtrMac(Type|Creator)|Mac(Type|Creator)|mactype|maccreator|appleFileHandler|afh' /tmp/ftrdb-symbols.txt || true
            echo; echo '===== GOT / APIs ====='; cat /tmp/ftrdb-got.txt
            echo; echo '===== DWARF ====='; cat /tmp/ftrdb-dwarf-focused.txt
            echo; echo '===== compile-unit functions ====='; cat /tmp/apple-cu-functions.tsv
            echo; echo '===== compile-unit disassembly ====='; cat /tmp/apple-cu-disassembly.txt
            echo; echo '===== disassembly ====='; cat /tmp/ftrdb-mac-disassembly.txt
            echo; echo '===== strings ====='; cat /tmp/ftrdb-mac-strings.txt
            echo; echo '===== older implementation ====='; cat /tmp/old-mactype.txt
          } > "$report"

      - name: Upload FTR mactype archaeology
        uses: actions/upload-artifact@v4
        with:
          name: ftr-mactype-archaeology
          path: /tmp/ftr-mactype-report/
          if-no-files-found: error
