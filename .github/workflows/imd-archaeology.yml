name: IMD binary archaeology

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/imd-archaeology.yml'

jobs:
  iconfinder-constructor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MIPS binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Extract original libimdApp
        run: |
          mkdir -p /tmp/imd-evidence

          # find the archive spelling actually present in the preserved
          # evidence. do not repack or normalize the original tar file.
          entry="$(tar -tf irix-re/evidence/shared_objects.tar | grep '/libimdApp.so$' | head -1)"
          test -n "$entry"
          echo "archive entry: $entry"
          tar -xf irix-re/evidence/shared_objects.tar -C /tmp/imd-evidence "$entry"

          app="/tmp/imd-evidence/$entry"
          file "$app"
          sha256sum "$app"
          echo "IMDAPP=$app" >> "$GITHUB_ENV"

      - name: Symbol neighborhood
        run: |
          # pull the nearby public/debug symbols before looking at the code.
          # this keeps the disassembly anchored to names recovered from the
          # original object rather than names invented during reconstruction.
          mips-linux-gnu-readelf -Ws "$IMDAPP" | c++filt | grep -E 'ImdIconFinder|ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget' || true

      - name: Map dynamic GOT calls
        run: |
          # N32 calls imported functions through the GOT. readelf's MIPS
          # architecture dump names those entries, allowing the constructor
          # load offsets to be associated with their original symbols.
          mips-linux-gnu-readelf -A "$IMDAPP" | c++filt > /tmp/imd-got.txt
          grep -E -B1 -A1 'ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget|XtManageChild|XtAddCallback|Xm|Vk' /tmp/imd-got.txt || true

          echo '--- import stubs ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963b7a0 \
            --stop-address=0x0963b900 \
            "$IMDAPP"

      - name: Disassemble ImdIconFinder constructor
        run: |
          # dump the complete binary-confirmed constructor. the next pass
          # correlates each jal/jalr target with strings and DWARF names.
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963ec5c \
            --stop-address=0x0963f350 \
            "$IMDAPP"

      - name: Dump constructor strings and relocations
        run: |
          echo '--- relevant strings ---'
          strings -a -t x "$IMDAPP" | grep -E 'iconFinder|finderSelection|findButton|IconBook|SearchBook|InfoScape|XmN|SgN' || true
          echo '--- relocations near constructor dependencies ---'
          mips-linux-gnu-readelf -rW "$IMDAPP" | c++filt | grep -E 'ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget|XtManageChild|Xm' || true
