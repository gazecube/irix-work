name: IMD binary archaeology

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/imd-archaeology.yml'

jobs:
  iconfinder-constructor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MIPS binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Extract original libimdApp
        run: |
          mkdir -p /tmp/imd-evidence
          tar -xf irix-re/evidence/shared_objects.tar -C /tmp/imd-evidence usr/lib32/internal/libimdApp.so
          file /tmp/imd-evidence/usr/lib32/internal/libimdApp.so
          sha256sum /tmp/imd-evidence/usr/lib32/internal/libimdApp.so

      - name: Symbol neighborhood
        run: |
          # pull the nearby public/debug symbols before looking at the code.
          # this keeps the disassembly anchored to names recovered from the
          # original object rather than names invented during reconstruction.
          mips-linux-gnu-readelf -Ws /tmp/imd-evidence/usr/lib32/internal/libimdApp.so | c++filt | grep -E 'ImdIconFinder|ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget' || true

      - name: Disassemble ImdIconFinder constructor
        run: |
          # dump the complete binary-confirmed constructor. the next pass
          # correlates each jal/jalr target with strings and DWARF names.
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963ec5c \
            --stop-address=0x0963f350 \
            /tmp/imd-evidence/usr/lib32/internal/libimdApp.so

      - name: Dump constructor strings and relocations
        run: |
          echo '--- relevant strings ---'
          strings -a -t x /tmp/imd-evidence/usr/lib32/internal/libimdApp.so | grep -E 'iconFinder|finderSelection|findButton|IconBook|SearchBook|InfoScape|XmN|SgN' || true
          echo '--- relocations near constructor dependencies ---'
          mips-linux-gnu-readelf -rW /tmp/imd-evidence/usr/lib32/internal/libimdApp.so | c++filt | grep -E 'ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget|XtManageChild|Xm' || true
