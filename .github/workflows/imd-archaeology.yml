name: IMD binary archaeology

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/imd-archaeology.yml'

jobs:
  iconfinder-constructor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MIPS binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Extract original IMD libraries
        run: |
          mkdir -p /tmp/imd-evidence

          # find the archive spelling actually present in the preserved
          # evidence. do not repack or normalize the original tar file.
          app_entry="$(tar -tf irix-re/evidence/shared_objects.tar | grep '/libimdApp.so$' | head -1)"
          panel_entry="$(tar -tf irix-re/evidence/shared_objects.tar | grep '/libimdIconPanel.so$' | head -1)"
          test -n "$app_entry"
          test -n "$panel_entry"

          echo "libimdApp archive entry: $app_entry"
          echo "libimdIconPanel archive entry: $panel_entry"
          tar -xf irix-re/evidence/shared_objects.tar -C /tmp/imd-evidence \
            "$app_entry" "$panel_entry"

          app="/tmp/imd-evidence/$app_entry"
          panel="/tmp/imd-evidence/$panel_entry"
          file "$app" "$panel"
          sha256sum "$app" "$panel"
          echo "IMDAPP=$app" >> "$GITHUB_ENV"
          echo "IMDICONPANEL=$panel" >> "$GITHUB_ENV"

      - name: Symbol neighborhood
        run: |
          # pull the nearby public/debug symbols before looking at the code.
          # this keeps the disassembly anchored to names recovered from the
          # original object rather than names invented during reconstruction.
          echo '--- libimdApp ---'
          mips-linux-gnu-readelf -Ws "$IMDAPP" | c++filt | grep -E 'ImdIconFinder|ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget' || true

          echo '--- libimdIconPanel ---'
          mips-linux-gnu-readelf -Ws "$IMDICONPANEL" | c++filt | grep -E 'ImdArgList|ImdModelBasedIconPanel|ImdSingleViewLayout|AdoptRenderer|AdoptLayout' || true

      - name: Map dynamic GOT calls
        run: |
          # N32 calls imported functions through the GOT. readelf's MIPS
          # architecture dump names those entries, allowing the constructor
          # load offsets to be associated with their original symbols.
          mips-linux-gnu-readelf -A "$IMDAPP" | c++filt > /tmp/imd-got.txt
          grep -E -B1 -A1 'ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget|XtManageChild|XtAddCallback|Xm|Vk' /tmp/imd-got.txt || true

          echo '--- import stubs ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963b7a0 \
            --stop-address=0x0963b900 \
            "$IMDAPP"

      - name: Disassemble ImdIconFinder constructor
        run: |
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963ec5c \
            --stop-address=0x0963f350 \
            "$IMDAPP"

      - name: Disassemble ImdIconFinder accessors
        run: |
          echo '--- destructor ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963cac4 \
            --stop-address=0x0963cc10 \
            "$IMDAPP"

          echo '--- getIconView ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963cc10 \
            --stop-address=0x0963cc9c \
            "$IMDAPP"

          echo '--- getWidget ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0963f350 \
            --stop-address=0x0963f358 \
            "$IMDAPP"

          echo '--- getCompletionField ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x09644b44 \
            --stop-address=0x09644b4c \
            "$IMDAPP"

          echo '--- getPocket ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x09644b88 \
            --stop-address=0x09644b90 \
            "$IMDAPP"

          echo '--- set/getTimoutBeforeTyping ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x09644788 \
            --stop-address=0x09644790 \
            "$IMDAPP"
          mips-linux-gnu-objdump -drC \
            --start-address=0x09644d7c \
            --stop-address=0x09644d84 \
            "$IMDAPP"

      - name: Disassemble original ImdArgList
        run: |
          # these addresses come directly from the original dynamic symbol
          # table. use them rather than relying on modern demangler spelling.
          echo '--- ImdArgList constructor ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967c180 \
            --stop-address=0x0967c23c \
            "$IMDICONPANEL"

          echo '--- ImdArgList setArg ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967c23c \
            --stop-address=0x0967c2b4 \
            "$IMDICONPANEL"

          echo '--- ImdArgList getArgList ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967c2b4 \
            --stop-address=0x0967c40c \
            "$IMDICONPANEL"

          echo '--- ImdArgList getNumArgs ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967c40c \
            --stop-address=0x0967c450 \
            "$IMDICONPANEL"

          echo '--- ImdArgList getValues ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967c450 \
            --stop-address=0x0967c4b4 \
            "$IMDICONPANEL"

          echo '--- ImdArgListImpl clear ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967c4b4 \
            --stop-address=0x0967c5bc \
            "$IMDICONPANEL"

          echo '--- ImdArgList clear ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967c5bc \
            --stop-address=0x0967c5f0 \
            "$IMDICONPANEL"

          echo '--- ImdArgList setValues ---'
          mips-linux-gnu-objdump -drC \
            --start-address=0x0967d06c \
            --stop-address=0x0967d0d0 \
            "$IMDICONPANEL"

      - name: Disassemble ModelBasedIconPanel constructor
        run: |
          mips-linux-gnu-objdump -drC \
            --start-address=0x09684610 \
            --stop-address=0x09685f6c \
            "$IMDICONPANEL"

      - name: Dump constructor strings and relocations
        run: |
          echo '--- libimdApp relevant strings ---'
          strings -a -t x "$IMDAPP" | grep -E 'iconFinder|finderSelection|findButton|IconBook|SearchBook|InfoScape|XmN|SgN' || true

          echo '--- libimdIconPanel resource strings ---'
          strings -a -t x "$IMDICONPANEL" | grep -E 'XmN|SgN|Scroll|drop|drag|select|rename|visual|background|ArgList' || true

          echo '--- relocations near constructor dependencies ---'
          mips-linux-gnu-readelf -rW "$IMDAPP" | c++filt | grep -E 'ImdArgList|ImdCompletionField|ImdModelBasedIconPanel|SgFinder|XtCreateWidget|XtManageChild|Xm' || true
