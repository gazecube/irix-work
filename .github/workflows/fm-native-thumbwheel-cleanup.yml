name: FM native ThumbWheel cleanup

on:
  push:
    paths:
      - '.github/workflows/fm-native-thumbwheel-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
      - name: Replace loader paradox path with native libSgm API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('irix-re/fm/FmMain.c++')
          s=p.read_text()
          def once(a,b):
              global s
              if s.count(a)!=1:
                  raise SystemExit('expected unique block not found: '+a[:80])
              s=s.replace(a,b,1)

          once('#include "FmIconSurface.h"\n', '#include "FmIconSurface.h"\n#include <Sgm/ThumbWheel.h>\n')
          once('#include <dlfcn.h>\n','')

          start=s.index('/*\n * RE: the preserved libSgm.so.1 exports sgThumbWheelWidgetClass,')
          end=s.index('static Widget\nmakeMenu', start)
          new='''static void\nscaleZoomCB(Widget widget, XtPointer client, XtPointer call)\n{\n    FmState *state = (FmState *)client;\n    SgThumbWheelCallbackStruct *cbs =\n        (SgThumbWheelCallbackStruct *)call;\n    int value = cbs ? cbs->value : 100;\n    float scale = (float)value / 100.0f;\n    char text[64];\n\n    ImdViewPanelSetScale(state->panelWidget, scale, 0, 0);\n    snprintf(text, sizeof(text), "Icon scale %d%%", value);\n    setStatus(state, text);\n    (void)widget;\n}\n\n'''
          s=s[:start]+new+s[end:]

          old='''    WidgetClass thumbWheelClass = resolveThumbWheelWidgetClass();\n\n    if (thumbWheelClass)\n    {\n        /*\n         * Binary/resource-backed scaleZoom settings. homePosition is an\n         * SgThumbWheel resource and is intentionally passed by its original\n         * resource name so this source does not require MaXX headers.\n         */\n        state->scaleZoom = XtVaCreateManagedWidget("scaleZoom",\n                                                    thumbWheelClass,\n                                                    rc1,\n                                                    XmNorientation, XmVERTICAL,\n                                                    XmNminimum, 60,\n                                                    XmNmaximum, 500,\n                                                    XmNvalue, 100,\n                                                    "homePosition", 100,\n                                                    XmNshowValue, False,\n                                                    XmNtraversalOn, False,\n                                                    NULL);\n        std::fprintf(stderr, "fm: scaleZoom uses SgThumbWheel\\n");\n    }\n    else\n    {\n        state->scaleZoom = XtVaCreateManagedWidget("scaleZoom",\n                                                    xmScaleWidgetClass,\n                                                    rc1,\n                                                    XmNorientation, XmVERTICAL,\n                                                    XmNprocessingDirection, XmMAX_ON_TOP,\n                                                    XmNminimum, 60,\n                                                    XmNmaximum, 500,\n                                                    XmNvalue, 100,\n                                                    XmNshowValue, False,\n                                                    XmNtraversalOn, False,\n                                                    NULL);\n        std::fprintf(stderr, "fm: SgThumbWheel unavailable; using XmScale fallback\\n");\n    }\n'''
          new='''    /*\n     * RE: scaleZoom is now the native reconstructed SGI SgThumbWheel class.\n     * These values are recovered from the original FileManager resources.\n     */\n    state->scaleZoom = XtVaCreateManagedWidget("scaleZoom",\n                                                sgThumbWheelWidgetClass,\n                                                rc1,\n                                                XmNorientation, XmVERTICAL,\n                                                XmNminimum, 60,\n                                                XmNmaximum, 500,\n                                                XmNvalue, 100,\n                                                SgNhomePosition, 100,\n                                                XmNtraversalOn, False,\n                                                NULL);\n'''
          once(old,new)
          p.write_text(s)

          c=Path('irix-re/fm/CMakeLists.txt')
          cs=c.read_text()
          cs=cs.replace('    target_link_libraries(fm PRIVATE ${CMAKE_DL_LIBS})\n\n','',1)
          c.write_text(cs)
          PY
      - name: Commit
        run: |
          git config user.name "db2k"
          git config user.email "33785843+gazecube@users.noreply.github.com"
          git add irix-re/fm/FmMain.c++ irix-re/fm/CMakeLists.txt
          git diff --cached --check
          git commit -m "fm: use reconstructed SgThumbWheel directly"
          git push origin HEAD:irix-re
