name: FM live geometry/layout fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fm-live-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re

      - name: Patch fm
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('irix-re/fm/FmMain.c++')
          s = p.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit('missing expected block:\n' + old)
              if s.count(old) != 1:
                  raise SystemExit('expected block is not unique:\n' + old)
              s = s.replace(old, new, 1)

          replace_once(
              '#include "ModelBasedIconPanel.h"\n#include "ImdIconPanel.h"\n',
              '#include "ModelBasedIconPanel.h"\n#include "ImdIconPanel.h"\n#include "IconLayout.h"\n')

          replace_once(
              '    ImdModelBasedIconPanel *dirPanel;\n    bool showHidden;\n',
              '    ImdModelBasedIconPanel *dirPanel;\n    ImdIconLayout *iconLayout;\n    bool showHidden;\n')

          replace_once(
              '    state.dirPanel = 0;\n    state.showHidden = false;\n',
              '    state.dirPanel = 0;\n    state.iconLayout = 0;\n    state.showHidden = false;\n')

          replace_once(
              '    up = XtVaCreateManagedWidget("pathfinder",\n',
              '    up = XtVaCreateManagedWidget("Up",\n')

          replace_once(
              '    renderer = new ImdInvertedTeeRenderer;\n    ImdViewPanelAdoptRenderer(state.panelWidget, renderer);\n\n    state.list = XtVaCreateManagedWidget("directoryList",\n',
              '    renderer = new ImdInvertedTeeRenderer;\n    ImdViewPanelAdoptRenderer(state.panelWidget, renderer);\n\n    /*\n     * RE: original FmWindow::_createPanels constructs ImdIconLayout with\n     * the live panel widget and adopts it before normal directory viewing.\n     */\n    state.iconLayout = new ImdIconLayout(state.panelWidget);\n    ImdViewPanelAdoptLayout(state.panelWidget, state.iconLayout);\n\n    state.list = XtVaCreateManagedWidget("directoryList",\n')

          replace_once(
              '    XtVaSetValues(state->list,\n                  XmNx, 0,\n                  XmNy, 0,\n                  XmNwidth, width,\n                  XmNheight, height,\n                  NULL);\n',
              '    /*\n     * This callback runs from the parent resize path. XtVaSetValues() on\n     * child geometry re-enters Motif geometry negotiation and recursively\n     * invokes this callback. Configure the child directly as its parent.\n     */\n    XtMoveWidget(state->list, 0, 0);\n    XtResizeWidget(state->list, width, height, 0);\n')

          old = '''    if (name && !strcmp(name, "listLayout")) {\n        populateDirectory(state, state->directory);\n        setStatus(state, "List layout");\n        return;\n    }\n\n    snprintf(text, sizeof(text), "%s layout path is not reconstructed yet",\n             name ? name : "Selected");\n'''
          new = '''    if (name && (!strcmp(name, "listLayout") ||\n                 !strcmp(name, "viewAsListMenuItem"))) {\n        populateDirectory(state, state->directory);\n        setStatus(state, "List layout");\n        return;\n    }\n\n    snprintf(text, sizeof(text), "%s layout path is not reconstructed yet",\n             name ? name : "Selected");\n'''
          replace_once(old, new)

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "db2k"
          git config user.email "33785843+gazecube@users.noreply.github.com"
          git add irix-re/fm/FmMain.c++
          git diff --cached --check
          git commit -m "fm: fix live geometry and adopt icon layout"
          git push origin HEAD:irix-re
