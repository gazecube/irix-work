name: FM resize guard

on:
  push:
    paths:
      - '.github/workflows/fm-resize-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re

      - name: Patch resize callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('irix-re/fm/FmMain.c++')
          s = p.read_text()

          s = s.replace(
              '    ImdIconLayout *iconLayout;\n    bool showHidden;\n',
              '    ImdIconLayout *iconLayout;\n    bool panelResizeActive;\n    bool showHidden;\n',
              1)

          s = s.replace(
              '    state.iconLayout = 0;\n    state.showHidden = false;\n',
              '    state.iconLayout = 0;\n    state.panelResizeActive = false;\n    state.showHidden = false;\n',
              1)

          old = '''    (void)call;\n    if (!state->list)\n        return;\n\n    XtVaGetValues(widget,\n                  XmNwidth, &width,\n                  XmNheight, &height,\n                  NULL);\n    /*\n     * This callback runs from the parent resize path. XtVaSetValues() on\n     * child geometry re-enters Motif geometry negotiation and recursively\n     * invokes this callback. Configure the child directly as its parent.\n     */\n    XtMoveWidget(state->list, 0, 0);\n    XtResizeWidget(state->list, width, height, 0);\n'''

          new = '''    Dimension childWidth = 1;\n    Dimension childHeight = 1;\n\n    (void)call;\n    if (!state->list || state->panelResizeActive)\n        return;\n\n    XtVaGetValues(widget,\n                  XmNwidth, &width,\n                  XmNheight, &height,\n                  NULL);\n    XtVaGetValues(state->list,\n                  XmNwidth, &childWidth,\n                  XmNheight, &childHeight,\n                  NULL);\n\n    if (childWidth == width && childHeight == height)\n        return;\n\n    /*\n     * bootstrap-only reentrancy guard. The temporary XmList negotiates\n     * geometry through the IMD panel and can synchronously trigger this\n     * callback again while XtVaSetValues() is still on the stack.\n     */\n    state->panelResizeActive = true;\n    XtVaSetValues(state->list,\n                  XmNx, 0,\n                  XmNy, 0,\n                  XmNwidth, width,\n                  XmNheight, height,\n                  NULL);\n    state->panelResizeActive = false;\n'''

          if old not in s:
              raise SystemExit('expected resize block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "db2k"
          git config user.email "33785843+gazecube@users.noreply.github.com"
          git add irix-re/fm/FmMain.c++
          git diff --cached --check
          git commit -m "fm: guard temporary list resize reentry"
          git push origin HEAD:irix-re
