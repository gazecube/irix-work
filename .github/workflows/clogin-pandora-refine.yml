name: Clogin Pandora reconstruction refinement

on:
  push:
    branches: [irix-re]
    paths:
      - '.github/workflows/clogin-pandora-refine.yml'
      - '.github/scripts/refine_clogin_pandora.py'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clogin-export
          fetch-depth: 0

      - name: Fetch reconstruction patch helper
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/gazecube/irix-work/irix-re/.github/scripts/refine_clogin_pandora.py \
            -o /tmp/refine_clogin_pandora.py

      - name: Apply binary-backed Pandora cleanup
        run: python3 /tmp/refine_clogin_pandora.py

      - name: Verify recovered filtering shape
        run: |
          grep -q 'Filesystem/DirectoryCheck.h' reconstruction/PandoraViewKit.c++
          grep -q 'checkDirectoryPortable' reconstruction/PandoraViewKit.c++
          ! grep -q 'pw_passwd.*"\\*"' reconstruction/PandoraViewKit.c++
          ! grep -q 'linuxProbeInteractiveShell' reconstruction/PandoraViewKit.c++

      - name: Commit refinement
        run: |
          git config user.name 'db2k'
          git config user.email '33785843+gazecube@users.noreply.github.com'
          git add reconstruction/PandoraViewKit.c++
          git commit -m 'clogin: align Pandora user filtering with binary'
          git push origin HEAD:clogin-export
