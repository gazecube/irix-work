name: FM selection binary archaeology

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fm-selection-archaeology.yml'

jobs:
  selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: irix-re
          lfs: true

      - name: Install MIPS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Extract original FM selection specimens
        run: |
          set -eu
          FM="$GITHUB_WORKSPACE/irix-re/evidence/fm"
          archive="$GITHUB_WORKSPACE/irix-re/evidence/shared_objects.tar"
          test -f "$FM"
          entry="$(tar -tf "$archive" | grep '/usr/lib32/internal/libimdIconPanel.so$' | head -1)"
          test -n "$entry"
          mkdir -p /tmp/fm-selection
          tar -xf "$archive" -C /tmp/fm-selection "$entry"
          PANEL="/tmp/fm-selection/$entry"
          echo "FM=$FM" >> "$GITHUB_ENV"
          echo "PANEL=$PANEL" >> "$GITHUB_ENV"
          file "$FM" "$PANEL"
          sha256sum "$FM" "$PANEL"

      - name: Recover selection symbols
        run: |
          set -eu
          mips-linux-gnu-readelf -Ws "$FM" > /tmp/fm-symbols.raw
          mips-linux-gnu-readelf -Ws "$PANEL" > /tmp/panel-symbols.raw
          mips-linux-gnu-readelf -Ws "$FM" | c++filt > /tmp/fm-symbols.txt
          mips-linux-gnu-readelf -Ws "$PANEL" | c++filt > /tmp/panel-symbols.txt
          grep -Ei 'FmMenuActions.*select|FmMenuHandler.*select|FmWindow.*select|SelectionHolder|selectionChanged|selectAll|select|deselect|selection|selected|ImdIconPanel|ImdIconView|ImdViewPanel' /tmp/fm-symbols.txt /tmp/panel-symbols.txt | tee /tmp/selection-symbols.txt || true

      - name: Disassemble exact named selection functions
        run: |
          set -eu
          out=/tmp/selection-disassembly.txt
          : > "$out"
          dump_symbol() {
            image="$1"; table="$2"; symbol="$3"
            row="$(awk -v s="$symbol" '$4=="FUNC" && $8==s {print $2, $3; exit}' "$table")"
            test -n "$row" || { echo "missing symbol: $symbol" >> "$out"; return; }
            start_hex="${row%% *}"; size="${row##* }"
            start=$((16#$start_hex)); stop=$((start + size))
            printf '\n===== %s 0x%x..0x%x size %d =====\n' "$symbol" "$start" "$stop" "$size" >> "$out"
            mips-linux-gnu-objdump -drC --start-address="$start" --stop-address="$stop" "$image" >> "$out"
          }
          for s in \
            selectAll__13FmMenuActionsGv \
            selectAllHelper__13FmMenuActionsSGP7ImdViewPv \
            setSelectionHolder__13FmMenuActionsGP22ImdModelBasedIconPanel \
            _getSelectionHolder__13FmMenuHandlerGv \
            selectChanged__13FmMenuHandlerGv \
            selectAllCB__8FmWindowSGP10_WidgetRecPvT2 \
            setSelectionHolder__8FmWindowGP22ImdModelBasedIconPanel \
            _selectionChangedCB__8FmWindowSGP16VkCallbackObjectPvT2; do
            dump_symbol "$FM" /tmp/fm-symbols.raw "$s"
          done
          for s in \
            enableMultipleSelect__12ImdIconPanelGb \
            beginSelectBlock__12ImdIconPanelGv \
            endSelectBlock__12ImdIconPanelGv \
            select__12ImdIconPanelGP11ImdIconView \
            extendSelect__12ImdIconPanelGP11ImdIconView \
            deselect__12ImdIconPanelGv \
            toggleSelection__12ImdIconPanelGP11ImdIconView \
            selectNotify__12ImdIconPanelGv \
            getSelected__12ImdIconPanelGv \
            getSelectedViewList__12ImdIconPanelGv; do
            dump_symbol "$PANEL" /tmp/panel-symbols.raw "$s"
          done
          cat "$out"

      - name: Recover selection literals and translations
        run: |
          set -eu
          {
            echo '===== FM ====='
            strings -a -t x "$FM" | grep -Ei 'select all|selectAll|select|deselect|selection|selected' || true
            echo '===== libimdIconPanel ====='
            strings -a -t x "$PANEL" | grep -Ei 'Select\(|ExtendSelect|Deselect|selectCallback|extendSelectCallback|selection|selected' || true
          } | tee /tmp/selection-literals.txt

      - name: Assemble evidence report
        run: |
          set -eu
          mkdir -p /tmp/fm-selection-report
          {
            echo '===== specimens ====='
            file "$FM" "$PANEL"
            sha256sum "$FM" "$PANEL"
            echo
            echo '===== symbols ====='
            cat /tmp/selection-symbols.txt
            echo
            echo '===== literals/translations ====='
            cat /tmp/selection-literals.txt
            echo
            echo '===== exact named disassembly ====='
            cat /tmp/selection-disassembly.txt
          } > /tmp/fm-selection-report/fm-selection-archaeology.txt

      - name: Upload FM selection archaeology
        uses: actions/upload-artifact@v4
        with:
          name: fm-selection-archaeology
          path: /tmp/fm-selection-report/
          if-no-files-found: error
