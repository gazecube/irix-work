name: Clogin passwd compatibility reconstruction

on:
  push:
    branches:
      - irix-re
    paths:
      - '.github/workflows/clogin-passwd-compat.yml'
      - '.github/scripts/apply-clogin-passwd-compat.py'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clogin-export
          fetch-depth: 0

      - name: Fetch patch helper
        run: |
          git show origin/irix-re:.github/scripts/apply-clogin-passwd-compat.py > /tmp/apply-clogin-passwd-compat.py

      - name: Apply binary-backed passwd compatibility loop
        run: python3 /tmp/apply-clogin-passwd-compat.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmotif-dev libx11-dev libxt-dev libxpm-dev libxcursor-dev libxinerama-dev libpam0g-dev

      - name: Build Clogin prototype
        run: make clean all

      - name: Verify compatibility shape
        run: |
          grep -q 'clogin_restore_passwd_position' clogin_reconstructed.h
          grep -q 'getpwnam(name)' clogin_reconstructed.h
          grep -q "pw->pw_name\[0\] == '-'" clogin_reconstructed.h
          grep -q "pw->pw_name\[0\] == '+'" clogin_reconstructed.h

      - name: Commit refinement
        run: |
          git config user.name 'db2k'
          git config user.email '33785843+gazecube@users.noreply.github.com'
          git add clogin_reconstructed.h
          git commit -m 'clogin: reconstruct passwd compatibility loop'
          git push origin HEAD:clogin-export
