# Traditional multihead (separate X screens :0.0 and :0.1) on one Radeon via
# the modesetting driver's ZaphodHeads.  Output names must match
# `xrandr --listmonitors` (currently DVI-I-2 left, HDMI-2 right).
# Install:  sudo install -m644 10-zaphod.conf /etc/X11/xorg.conf.d/
# Revert:   sudo rm /etc/X11/xorg.conf.d/10-zaphod.conf
Section "Device"
    Identifier "Radeon-0"
    Driver     "modesetting"
    Option     "ZaphodHeads" "DVI-I-2"
    Screen     0
EndSection

Section "Device"
    Identifier "Radeon-1"
    Driver     "modesetting"
    Option     "ZaphodHeads" "HDMI-2"
    Screen     1
EndSection

Section "Screen"
    Identifier "Screen-0"
    Device     "Radeon-0"
EndSection

Section "Screen"
    Identifier "Screen-1"
    Device     "Radeon-1"
EndSection

Section "ServerLayout"
    Identifier "Layout"
    Screen 0 "Screen-0" 0 0
    Screen 1 "Screen-1" RightOf "Screen-0"
    Option "Xinerama" "off"
EndSection
