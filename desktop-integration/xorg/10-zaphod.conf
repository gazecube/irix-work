# Traditional multihead (separate X screens :0.0 and :0.1) on one Radeon via
# the radeon DDX (xf86-video-ati) ZaphodHeads.  The modesetting driver dies
# with 'Failed to create pixmap' on the second screen, so it is not used.
# Output names are the radeon DDX's, NOT modesetting's.  DVI-1 is the 1600x900
# main display and HDMI-1 the 1280x1024 one (check `xrandr` under radeon).
# Install:  sudo install -m644 10-zaphod.conf /etc/X11/xorg.conf.d/
# Revert:   sudo rm /etc/X11/xorg.conf.d/10-zaphod.conf
Section "Device"
    Identifier "Radeon-0"
    Driver     "radeon"
    Option     "ZaphodHeads" "DVI-1"
    Screen     0
EndSection

Section "Device"
    Identifier "Radeon-1"
    Driver     "radeon"
    Option     "ZaphodHeads" "HDMI-1,DisplayPort-3"
    Screen     1
EndSection

Section "Screen"
    Identifier "Screen-0"
    Device     "Radeon-0"
EndSection

Section "Screen"
    Identifier "Screen-1"
    Device     "Radeon-1"
EndSection

Section "ServerLayout"
    Identifier "Layout"
    Screen 0 "Screen-0" 0 0
    Screen 1 "Screen-1" RightOf "Screen-0"
    Option "Xinerama" "off"
EndSection
